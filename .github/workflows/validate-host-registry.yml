name: Validate web and Hosts Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend JavaScript syntax
        run: node --check server.js
      - name: Validate Admin script and Hosts Registry contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('public/admin.html', 'utf8');
          const server = fs.readFileSync('server.js', 'utf8');
          const schema = fs.readFileSync('schema.sql', 'utf8');

          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (scripts.length !== 1) throw new Error('Expected exactly one Admin script');
          new vm.Script(scripts[0][1], { filename: 'public/admin.html inline script' });

          const requirements = [
            [server, "app.get('/api/hosts-config'", 'public Launcher endpoint'],
            [server, "app.get('/admin/api/hosts'", 'protected Admin read endpoint'],
            [server, "app.put('/admin/api/hosts'", 'protected Admin save endpoint'],
            [server, "app.get('/admin/api/hosts/audit'", 'protected audit endpoint'],
            [server, "supabase.rpc('save_host_registry'", 'transactional database save'],
            [html, 'id="hostsPanel"', 'Hosts Registry panel'],
            [html, "api('/admin/api/hosts')", 'Admin registry client'],
            [html, "api('/api/hosts-config')", 'documented public endpoint label'],
            [schema, 'create table if not exists public.host_registry', 'registry table'],
            [schema, 'alter table public.host_registry enable row level security', 'registry RLS']
          ];
          for (const [source, needle, label] of requirements) {
            if (!source.includes(needle)) throw new Error('Missing contract: ' + label);
          }
          if (html.includes('SUPABASE_SERVICE_ROLE_KEY') || html.includes('SUPABASE_SECRET_KEY')) {
            throw new Error('Database secret must not be exposed in the browser');
          }
          console.log('Admin inline script parses; backend and Registry contracts are present.');
          NODE
